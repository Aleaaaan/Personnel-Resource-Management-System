server:
  port: 8080
  servlet:
    encoding:
      charset: UTF-8
      force: true

spring:
  application:
    name: hrms-backend
  datasource:
    url: jdbc:h2:file:./data/hrms;DB_CLOSE_ON_EXIT=FALSE;MODE=MySQL
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    open-in-view: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect
        format_sql: false
  h2:
    console:
      enabled: true
      path: /h2-console
  jackson:
    time-zone: Asia/Shanghai
    serialization:
      write-dates-as-timestamps: false

hrms:
  jwt:
    secret: hrms-personnel-resource-management-system-jwt-secret-2026
    expiration: 86400000

logging:
  level:
    com.hrms: info
    org.springframework.security: warn
